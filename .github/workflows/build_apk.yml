name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Android APK
        run: |
          cd frontend
          flutter build apk --release

      - name: Rename APK
        run: |
          mv frontend/build/app/outputs/flutter-apk/app-release.apk frontend/build/app/outputs/flutter-apk/msu_dcs_alumni.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MSU DCS Alumni Mobile App (v1.0.0)"
          body: |
            ### 📱 MSU DCS Alumni Mobile App (Android APK)
            
            Official Android APK connected to the live Render cloud backend:
            **API URL:** `https://msu-dcs-alumni-backend.onrender.com`
            
            #### 📥 Installation Instructions:
            1. Download `msu_dcs_alumni.apk` from the asset link below.
            2. Open the downloaded file on your Android phone.
            3. If prompted, allow "Install from unknown sources" or "Install unknown apps".
            4. Open the app and log in with your demo credentials!
          files: frontend/build/app/outputs/flutter-apk/msu_dcs_alumni.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
