name: msu_dcs_alumni
description: "MSU DCS Alumni Tracking Mobile Application"
publish_to: 'none'
version: 1.2.2+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  intl: ^0.19.0
  shared_preferences: 2.2.2
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_android: 2.2.15
  shared_preferences_android: 2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
